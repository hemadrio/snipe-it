name: Tests in MySQL

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: snipeit
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    name: PHP ${{ matrix.php-version }}

    steps:
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: none
          # ParaTest spawns a worker per core as a separate PHP process
          # and forwards ini flags only via --passthru-php, so bump the
          # memory limit here when setting up PHP rather than
          # on the test command.
          ini-values: memory_limit=1G

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # PHP2Shell patched floor verification (CVE-2026-109618, CVE-2026-109619)
      # Approved floors: 8.2.35 (80235), 8.3.36 (80336), 8.4.27 (80427), 8.5.12 (80512)
      - name: Verify PHP meets PHP2Shell patched floor
        run: |
          php -r '
            $floors = ["8.2" => 80235, "8.3" => 80336, "8.4" => 80427, "8.5" => 80512];
            $branch = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;
            echo "PHP " . PHP_VERSION . " (branch $branch, ID: " . PHP_VERSION_ID . ")\n";
            if (!isset($floors[$branch])) {
              fwrite(STDERR, "ERROR: PHP branch $branch is not tracked in the PHP2Shell security policy.\n");
              exit(1);
            }
            if (PHP_VERSION_ID < $floors[$branch]) {
              fwrite(STDERR, "ERROR: PHP " . PHP_VERSION . " is below the patched floor for branch $branch (minimum ID: " . $floors[$branch] . ").\n");
              fwrite(STDERR, "Approved patched floors: 8.2.35, 8.3.36, 8.4.27, 8.5.12\n");
              exit(1);
            }
            echo "PHP2Shell floor check passed.\n";
          '

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php-version }}-composer-

      - name: Copy .env
        run: |
          cp -v .env.testing.example .env
          cp -v .env.testing.example .env.testing

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Laravel
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: snipeit
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_USERNAME: root
        run: |
          php artisan key:generate
          php artisan migrate --force
          php artisan passport:install --no-interaction
          chmod -R 777 storage bootstrap/cache

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: snipeit
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_USERNAME: root
          LOG_CHANNEL: single
          LOG_LEVEL: debug
        run: php artisan test --parallel

      - name: Upload Laravel logs as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs-php-${{ matrix.php-version }}-run-${{ github.run_attempt }}
          path: |
            storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
